<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Syed Zain Ali</title>
    <!-- Critical, JS-free paint: the page is dark from the very first frame, so there is never a
         white "waiting for localhost" flash before the Vue loading screen mounts on top. -->
    <style>
      html, body { margin: 0; background: #0c0c0b; }
      #boot { position: fixed; inset: 0; background: #0c0c0b; z-index: 9999; }
    </style>
  </head>
  <body>
    <div id="boot"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
